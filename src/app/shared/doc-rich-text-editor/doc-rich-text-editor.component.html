<div class="doc-editor-shell">
  @if (!readonly) {
    <div class="doc-editor-toolbar" role="toolbar" aria-label="Formatting">
      <button type="button" title="Bold" aria-label="Bold" (mousedown)="$event.preventDefault()" (click)="exec('bold')" [disabled]="showSource"><b>B</b></button>
      <button type="button" title="Italic" aria-label="Italic" (mousedown)="$event.preventDefault()" (click)="exec('italic')" [disabled]="showSource"><i>I</i></button>
      <button type="button" title="Underline" aria-label="Underline" (mousedown)="$event.preventDefault()" (click)="exec('underline')" [disabled]="showSource"><u>U</u></button>
      <button type="button" title="Heading 1" (mousedown)="$event.preventDefault()" (click)="formatBlock('h1')" [disabled]="showSource">H1</button>
      <button type="button" title="Heading 2" (mousedown)="$event.preventDefault()" (click)="formatBlock('h2')" [disabled]="showSource">H2</button>
      <button type="button" title="Bulleted list" aria-label="Bulleted list" (mousedown)="$event.preventDefault()" (click)="exec('insertUnorderedList')" [disabled]="showSource"><dk-icon name="menu" /></button>
      <button type="button" title="Link" aria-label="Link" (mousedown)="$event.preventDefault()" (click)="insertLink()" [disabled]="showSource"><dk-icon name="link" /></button>
      <span class="doc-editor-toolbar-spacer"></span>
      <div class="doc-editor-view" role="group" aria-label="View">
        <button type="button" [class.is-on]="!showSource" (click)="setView('visual')">Visual</button>
        <button type="button" [class.is-on]="showSource" (click)="setView('html')" title="View HTML source">‹› HTML</button>
      </div>
    </div>
  }

  <div class="doc-editor-page">
    <div
      #editableCanvas
      class="doc-editor-canvas"
      [hidden]="showSource"
      [class.is-empty]="isEmpty"
      data-placeholder="Start typing…"
      [attr.contenteditable]="readonly ? 'false' : 'true'"
      (input)="onCanvasInput()"
      data-cy="editor-canvas"
    ></div>
    @if (isEmpty && !showSource && !readonly) {
      <ng-content select="[docEditorEmpty]"></ng-content>
    }
    @if (showSource) {
      <textarea class="doc-editor-source-textarea" [ngModel]="sourceDraft" (ngModelChange)="onSourceChange($event)" spellcheck="false" aria-label="HTML source"></textarea>
    }
  </div>
</div>
