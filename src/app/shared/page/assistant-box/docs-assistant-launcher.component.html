<div class="docs-assistant-root">
  <div class="docs-assistant-hotzone" aria-hidden="true"></div>
  <button
    type="button"
    class="talk-to-assistant-glass"
    [class.talk-to-assistant-glass-hidden]="showAssistant || !launcherVisible"
    (click)="toggleAssistant()"
    [attr.aria-expanded]="showAssistant"
    aria-label="Talk to 16Ahead"
  >
    <span class="docs-assistant-launcher-icon" [class.docs-assistant-launcher-icon-unread]="hasUnread && !showAssistant">
      <i class="fa-solid fa-message"></i>
    </span>
    <span class="docs-assistant-launcher-label">{{ hasUnread && !showAssistant ? 'Do this next' : 'Talk to 16Ahead' }}</span>
  </button>

  <div class="docs-assistant-scrim" *ngIf="showAssistant" (click)="dismissAssistant()" aria-hidden="true"></div>
  <div class="docs-assistant-window" [class.docs-assistant-window-open]="showAssistant" role="dialog" aria-label="16Ahead">
    <div class="docs-assistant-header">
      <div class="docs-assistant-header-main">
        <div class="docs-assistant-avatar">
          <img class="brand-mark--light" src="assets/brand/products/png/light/01-16ahead-64.png" alt="16Ahead Avatar" style="max-height: 48px;" /><img class="brand-mark--dark" src="assets/brand/products/png/dark/01-16ahead-64.png" alt="16Ahead Avatar" style="max-height: 48px;" />
        </div>
        <div>
          <div class="docs-assistant-title">16Ahead</div>
          <div class="docs-assistant-subtitle">Momentum System</div>
        </div>
      </div>
      <div class="docs-assistant-header-actions">
        <button type="button" class="docs-assistant-close" (click)="dismissAssistant()" aria-label="Close 16Ahead assistant">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
    </div>
    <div class="docs-assistant-body">
      <section class="activation-card" [ngClass]="card.toneClass" *ngIf="guidanceCard as card">
        <div class="activation-card__eyebrow">{{ card.eyebrow }}</div>
        <div class="activation-card__header">
          <div class="activation-card__title-row">
            <span class="activation-card__icon"><i [class]="card.icon" aria-hidden="true"></i></span>
            <strong>{{ card.title }}</strong>
          </div>
          <span class="activation-card__stage">{{ card.stageLabel }}</span>
        </div>
        <p class="activation-card__message">{{ card.message }}</p>
        <p class="activation-card__message"><strong>Why it matters:</strong> {{ card.whyItMatters }}</p>
        <div class="activation-card__facts" *ngIf="card.bullets.length">
          <span class="activation-card__fact" *ngFor="let line of card.bullets">{{ line }}</span>
        </div>
        <div class="activation-card__eyebrow" style="margin-top: 10px; margin-bottom: 0;" *ngIf="card.nextStage">NEXT STAGE: {{ card.nextStage }}</div>
      </section>

      <app-assistant-box
        [userId]="userId"
        [tenantId]="tenantId"
        [pageContext]="pageContext"
        [isOpen]="showAssistant"
        [placeholder]="isLoggedIn ? 'Ask about a document, or tell me what you need.' : 'Ask what Docs does, or how to get started.'"
        (navigateTo)="onAssistantNavigate($event)"
      ></app-assistant-box>
    </div>
  </div>
</div>
