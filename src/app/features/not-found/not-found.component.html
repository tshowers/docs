<div class="nf" data-cy="not-found">
  <img class="nf__avatar brand-mark--light" src="assets/brand/products/svg/light/01-16ahead.svg" alt="" /><img class="nf__avatar brand-mark--dark" src="assets/brand/products/svg/dark/01-16ahead.svg" alt="" />
  <h1>I couldn't find that page</h1>
  <p>The link may be old, or the item was moved or deleted. Search for it, or go back to Home.</p>
  <form class="nf__ask" (submit)="$event.preventDefault(); search()">
    <dk-icon name="search" [size]="20" />
    <input name="q" [value]="query()" (input)="query.set($any($event.target).value)" placeholder="Search documents, knowledge and opportunities…" aria-label="Search" />
    <button type="submit" class="dk-btn dk-btn--primary" [disabled]="!query().trim()">Go</button>
  </form>
  <a class="dk-btn" routerLink="/"><dk-icon name="home" />Home</a>
</div>
