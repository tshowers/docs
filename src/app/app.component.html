<app-docs-header *ngIf="!isEmbedded && !hideHeader" />
<div *ngIf="updateNotice" class="docs-update-notice" role="status" aria-live="polite"><span>{{ updateNotice }}</span><button *ngIf="chunkRecoveryNeedsManualRefresh" type="button" (click)="refreshAfterChunkError()">Refresh</button><button *ngIf="!chunkRecoveryNeedsManualRefresh" type="button" aria-label="Dismiss update notification" (click)="dismissUpdateNotice()">×</button></div>
<router-outlet></router-outlet>
<!-- The assistant launcher and its engine load once the page is idle, keeping them out of the initial bundle. -->
@if (!isEmbedded) { @defer (on idle) { <app-docs-assistant-launcher /> } }
<app-toast></app-toast>
<app-write-access-prompt />
